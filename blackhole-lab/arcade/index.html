<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ארקייד החלל</title>
<meta name="description" content="משחקי חלל, חלליות וחורים שחורים בעברית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
:root{
  --void:#04050b;--panel:#10142a;--panel2:#161b38;--line:#272e55;
  --text:#e8eaf6;--muted:#98a0c8;--flare:#ff9a3c;--ion:#5fd4ff;--ok:#56e39f;
  --display:'Karantina','Assistant',system-ui,sans-serif;--body:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body{font-family:var(--body);font-size:16px;line-height:1.55;color:var(--text);background:radial-gradient(1200px 700px at 85% -10%,#1a1440 0%,transparent 60%),radial-gradient(900px 600px at 0% 110%,#2a1208 0%,transparent 55%),var(--void);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--flare);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,7vw,4.6rem);line-height:.85;margin:0}
h1 span{color:var(--flare)}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,a.btn{font:inherit;cursor:pointer}
.btn,.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:9px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover,.icon-btn:hover{border-color:#47518a}
.btn.primary{background:linear-gradient(180deg,#ffae5a,#f07a22);color:#1a0b00;border-color:#ffb46a}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--flare);background:var(--panel2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;color:var(--text);text-decoration:none;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--flare);transform:translateY(-2px)}
.card canvas{width:100%;aspect-ratio:16/10;border-radius:9px;background:#03040a;display:block}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.num{font-family:var(--mono);font-size:.78rem;color:var(--flare)}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.card h3{margin:0;font-family:var(--display);font-size:1.9rem;line-height:1;font-weight:700}
.card .en{margin:0;font-size:.82rem;color:var(--muted)}
.card .best{margin:0;font-size:.8rem;color:var(--ok);min-height:1.2em;font-family:var(--mono)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#pNum{color:var(--muted);font-family:var(--mono);font-size:.85rem}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.screen{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/10;max-width:100%}
#game{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{position:absolute;top:8px;inset-inline:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip2{background:rgba(6,8,20,.72);border:1px solid rgba(120,130,200,.25);border-radius:10px;padding:3px 9px;font-size:.78rem;display:flex;gap:7px}
.chip2 .k{color:var(--muted)}.chip2 .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.msg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,4,10,.6);padding:16px}
.mcard{background:rgba(16,20,42,.96);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.mcard h3{font-family:var(--display);font-size:2.4rem;line-height:.95;margin:0}
.mcard p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pbtn{flex:1 1 0;min-width:64px;max-width:140px;padding:16px 0;font-size:1.3rem;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
.pbtn.on{border-color:var(--flare);background:#2a2240}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-size:2.4rem;line-height:.9;margin:0}
#pEn{color:var(--muted);font-size:.85rem;font-weight:600;margin-top:-6px}
.panel p{margin:0}
.panel ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.panel ol li::marker{color:var(--flare);font-family:var(--mono)}
.keys{font-size:.88rem;color:var(--muted)}
.best2{color:var(--ok);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="eyebrow">חלליות, כוכבי לכת וחורים שחורים</span>
      <h1>ארקייד <span>החלל</span></h1>
      <p class="sub"><span id="count"></span> משחקים קצרים בעברית. בחרו משחק, קראו את ההוראות ולחצו "התחילו".</p>
    </div>
    <div class="tools">
      <a class="btn" href="../">מעבדת החור השחור</a>
      <button class="icon-btn" id="mute" aria-pressed="false">🔊 צליל פועל</button>
    </div>
  </header>

  <section id="hub">
    <div class="filters" role="group" aria-label="סינון">
      <button class="chip" data-f="all" aria-pressed="true">הכול</button>
      <button class="chip" data-f="אקשן" aria-pressed="false">אקשן</button>
      <button class="chip" data-f="מיומנות" aria-pressed="false">מיומנות</button>
      <button class="chip" data-f="דיוק" aria-pressed="false">דיוק</button>
      <button class="chip" data-f="חשיבה" aria-pressed="false">חשיבה</button>
    </div>
    <div class="grid" id="grid" style="margin-top:14px"></div>
  </section>

  <section id="player" hidden>
    <div class="bar"><button class="btn" id="back">→ כל המשחקים</button><span id="pNum"></span></div>
    <div class="stage" style="margin-top:12px">
      <div class="col">
        <div class="screen">
          <canvas id="game" aria-label="אזור המשחק"></canvas>
          <div class="hud" id="hud"></div>
          <div class="msg" id="msg" hidden>
            <div class="mcard"><h3 id="msgT"></h3><p id="msgB"></p>
              <div class="row"><button class="btn primary" id="msgBtn"></button><button class="btn" id="msgBtn2" hidden>כל המשחקים</button></div>
            </div>
          </div>
        </div>
        <div class="pad" id="pad" dir="ltr" hidden></div>
      </div>
      <aside class="panel">
        <h2 id="pName"></h2>
        <div id="pEn"></div>
        <p id="pDesc"></p>
        <ol id="pHow"></ol>
        <p class="keys" id="pKeys"></p>
        <p class="best2" id="pBest"></p>
        <div class="row" style="justify-content:flex-start">
          <button class="btn" id="restart">התחלה מחדש</button>
          <button class="btn" id="prev">הקודם</button>
          <button class="btn" id="next">הבא</button>
        </div>
      </aside>
    </div>
  </section>
</div>
<script src="engine.js"></script>
<script src="games-a.js"></script>
<script src="games-b.js"></script>
<script src="games-c.js"></script>
<script>Arcade.boot()</script>
</body>
</html>
